<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Daily Workout</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f1115'/%3E%3Ctext x='50%25' y='58%25' text-anchor='middle' font-family='-apple-system,Segoe UI,sans-serif' font-size='36' font-weight='700' fill='%23ffd166'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
</head>
<body>
  <main id="app" class="app">
    <header class="hd">
      <p class="hd__date" id="date"></p>
      <h1 class="hd__title">Today's Workout</h1>
      <p class="hd__sub" id="region-label"></p>
    </header>

    <section id="card" class="card" hidden>
      <a id="card-link" class="card__link" target="_blank" rel="noopener">
        <div class="card__media">
          <img id="card-img" alt="" loading="eager" decoding="async">
        </div>
        <div class="card__body">
          <h2 id="card-title" class="card__title"></h2>
          <p class="card__cta">Open on Darebee →</p>
        </div>
      </a>
    </section>

    <section id="loading" class="state">Loading…</section>
    <section id="error" class="state state--err" hidden></section>

    <footer class="ft">
      <p>Workouts from <a href="https://darebee.com/" target="_blank" rel="noopener">darebee.com</a></p>
    </footer>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
