name: Refresh workouts

on:
  schedule:
    - cron: "0 6 1-7 * 6"   # First Saturday of every month 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrape Darebee
        run: node scripts/scrape.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- workouts.json; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workouts.json
          git commit -m "Refresh workouts ($(date -u +%Y-%m-%d))"
          git push
